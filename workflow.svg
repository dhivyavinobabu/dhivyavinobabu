<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#05070D" stop-opacity="1"/><stop offset=".5" stop-color="#05070D" stop-opacity="0"/></linearGradient>
</defs>
