finite"/></circle><circle cx="1100.0" cy="105" r="10" fill="#0B1020" stroke="#22D3EE" stroke-width="2"/><circle cx="1100.0" cy="105" r="3" fill="#22D3EE"/><text x="1100.0" y="157" fill="#E6EDF3" font-size="15" letter-spacing="2" text-anchor="middle">ITERATE</text><text class="s" x="1100.0" y="179" fill="#8B949E" font-size="14" text-anchor="middle">improve it</text><circle r="5" fill="#E6EDF3"><animateMotion path="M100.0 105H1100.02" dur="14s" repeatCount="indefinite" calcMode="linear"/></circle><rect x=".5" y=".5" width="1199" height="259" rx="14" fill="none" stroke="#1B2540"/></svg>